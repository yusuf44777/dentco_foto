services:

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.local
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app   # hot-reload için

  ingestion:
    build: ./backend
    env_file:
      - ./backend/.env.local
    command: >
      python -m app.services.ingestion
      --event-id ${EVENT_ID}
    profiles:
      - ingestion          # sadece açıkça çağırınca başlar
